<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Affitti Reggio Emilia</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #fff;
      --page: #f7f6f3;
      --text: #37352f;
      --muted: #787774;
      --border: #e9e9e7;
      --hover: #efefed;
      --blue: #2383e2;
      --blue-bg: #e7f3ff;
      --tag: #f1f1ef;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--page);
      color: var(--text);
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      letter-spacing: -0.01em;
    }
    aside {
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    header { padding: 28px 24px 16px; }
    header .emoji { font-size: 1.6rem; line-height: 1; margin-bottom: 8px; }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .filters {
      padding: 0 16px 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .chip {
      border: none;
      background: var(--tag);
      color: var(--text);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: inherit;
    }
    .chip:hover { background: var(--hover); }
    .chip.active {
      background: var(--blue-bg);
      color: var(--blue);
      font-weight: 550;
    }
    #count {
      padding: 0 24px 8px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    #list { overflow: auto; flex: 1; padding: 0 8px 16px; }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .row:hover { background: var(--hover); }
    .row.active {
      background: var(--blue-bg);
      border-color: #cce4fc;
    }
    .row .title {
      font-size: 0.92rem;
      font-weight: 550;
      line-height: 1.3;
    }
    .row .meta {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.35;
    }
    .row .price {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .row a {
      color: var(--blue);
      text-decoration: none;
      font-size: 0.78rem;
    }
    .row a:hover { text-decoration: underline; }
    .empty {
      color: var(--muted);
      padding: 16px 12px;
      font-size: 0.85rem;
    }
    #map { width: 100%; height: 100%; background: #f0f0f0; }
    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      font-family: inherit;
    }
    .leaflet-popup-content {
      margin: 12px 14px;
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.4;
    }
    .leaflet-popup-content a { color: var(--blue); }
    .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; grid-template-rows: 42% 58%; }
      aside { border-right: none; border-bottom: 1px solid var(--border); }
      header { padding: 16px 16px 8px; }
    }
  </style>
</head>
<body>
  <aside>
    <header>
      <div class="emoji">🏠</div>
      <h1>Affitti RE</h1>
      <p class="sub">Arredati · max 900 € · 3 persone<br/>Zone: sud/est + Ospizio / Baragalla<br/><span id="updated"></span></p>
    </header>
    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">Tutti</button>
      <button class="chip" data-filter="garage">Garage</button>
      <button class="chip" data-filter="3bed">3 camere</button>
      <button class="chip" data-filter="under280">≤280 €/testa</button>
    </div>
    <div id="count"></div>
    <div id="list"></div>
  </aside>
  <div id="map"></div>
  <script>
    let LISTINGS = [];

    async function loadListings() {
      const res = await fetch("listings.json?t=" + Date.now());
      if (!res.ok) throw new Error("listings.json");
      const data = await res.json();
      LISTINGS = data.listings || data;
      const meta = document.getElementById("updated");
      if (meta && data.updatedAt) {
        const d = new Date(data.updatedAt);
        meta.textContent = "Aggiornato " + d.toLocaleString("it-IT", {
          day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
        });
      }
    }

    const map = L.map("map", { zoomControl: true }).setView([44.685, 10.630], 13);
    // Esri World Light Gray — essenziale, senza API key
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 16,
      attribution: "Tiles &copy; Esri"
    }).addTo(map);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 16,
      attribution: ""
    }).addTo(map);

    const markers = {};
    let activeFilter = "all";

    function totalCost(l) { return l.price + (l.expenses || 0); }
    function perPerson(l) { return Math.round(totalCost(l) / 3); }
    function matches(l) {
      if (activeFilter === "garage") return !!l.garage;
      if (activeFilter === "3bed") return (l.bedrooms || 0) >= 3;
      if (activeFilter === "under280") return perPerson(l) <= 280;
      return true;
    }
    function fmtAvail(a) {
      if (!a) return "";
      if (a === "subito") return " · subito";
      return " · " + a;
    }
    function popupHtml(l) {
      const exp = l.expenses != null ? ` + ${l.expenses} spese` : "";
      return `<div style="font-weight:600;margin-bottom:4px">${l.title}</div>
        <div style="color:#787774;margin-bottom:6px">${l.zone}</div>
        <div><b>${l.price} €</b>${exp} · ~${perPerson(l)} €/testa</div>
        <div style="color:#787774;margin:4px 0 8px">${l.mq || "?"} mq · ${l.bedrooms || "?"} camere${l.garage ? " · garage" : ""}${fmtAvail(l.available)}</div>
        <a href="${l.url}" target="_blank" rel="noopener">Apri annuncio →</a>`;
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      Object.values(markers).forEach(m => map.removeLayer(m));
      Object.keys(markers).forEach(k => delete markers[k]);

      const shown = LISTINGS.filter(matches).sort((a, b) => a.price - b.price);
      document.getElementById("count").textContent =
        shown.length + (shown.length === 1 ? " annuncio" : " annunci");

      if (!shown.length) {
        list.innerHTML = '<p class="empty">Niente con questo filtro.</p>';
        return;
      }

      const bounds = [];
      shown.forEach((l) => {
        const marker = L.circleMarker([l.lat, l.lng], {
          radius: 8,
          color: "#fff",
          weight: 2,
          fillColor: "#2383e2",
          fillOpacity: 1
        }).addTo(map).bindPopup(popupHtml(l));
        markers[l.id] = marker;
        bounds.push([l.lat, l.lng]);

        const bits = [
          l.zone,
          (l.mq ? l.mq + " mq" : null),
          (l.bedrooms ? l.bedrooms + " camere" : null),
          l.garage ? "garage" : null,
          l.expenses != null ? "+" + l.expenses + " spese" : null,
          "~" + perPerson(l) + " €/testa"
        ].filter(Boolean);

        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <div class="title">${l.title}</div>
          <div class="price">${l.price} €</div>
          <div class="meta">${bits.join(" · ")}${fmtAvail(l.available)} · <a href="${l.url}" target="_blank" rel="noopener">annuncio</a></div>`;
        row.addEventListener("click", (e) => {
          if (e.target.tagName === "A") return;
          document.querySelectorAll(".row").forEach(c => c.classList.remove("active"));
          row.classList.add("active");
          map.setView([l.lat, l.lng], 15);
          marker.openPopup();
        });
        list.appendChild(row);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.filter;
      render();
    });

    (async () => {
      try {
        await loadListings();
        render();
      } catch (err) {
        document.getElementById("list").innerHTML =
          '<p class="empty">Errore nel caricamento.</p>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
