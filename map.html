<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cerco Casa Avidamente</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="vendor/leaflet.js"></script>
  <style>
    :root {
      --bg: #fff;
      --page: #f7f6f3;
      --text: #37352f;
      --muted: #787774;
      --border: #e9e9e7;
      --hover: #efefed;
      --blue: #2383e2;
      --blue-bg: #e7f3ff;
      --tag: #f1f1ef;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; height: 100dvh; margin: 0; }
    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--page);
      color: var(--text);
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      letter-spacing: -0.01em;
    }
    aside {
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    header { padding: 28px 24px 16px; }
    header .emoji { font-size: 1.6rem; line-height: 1; margin-bottom: 8px; }
    header h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    header .sub { margin: 6px 0 0; color: var(--muted); font-size: 0.8rem; line-height: 1.4; }
    header a { color: var(--blue); text-decoration: none; }
    #count { padding: 0 24px 8px; font-size: 0.75rem; color: var(--muted); }
    #list { overflow: auto; flex: 1; padding: 0 8px 16px; }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .row:hover { background: var(--hover); }
    .row.active { background: var(--blue-bg); border-color: #cce4fc; }
    .row .title { font-size: 0.92rem; font-weight: 550; line-height: 1.3; }
    .row .meta { grid-column: 1 / -1; color: var(--muted); font-size: 0.78rem; line-height: 1.35; }
    .row .price { font-size: 0.92rem; font-weight: 600; white-space: nowrap; }
    .empty { color: var(--muted); padding: 16px 12px; font-size: 0.85rem; }
    #map { width: 100%; height: 100%; min-height: 0; background: #e8e8e6; }
    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(15, 15, 15, .12);
      font-family: inherit;
      padding: 0;
    }
    .leaflet-popup-content { margin: 0; width: 280px !important; }
    .leaflet-popup-tip { box-shadow: none; }
    .card-pop { padding: 0 0 12px; }
    .card-photo {
      width: 100%;
      height: 156px;
      object-fit: cover;
      display: block;
      background: #efefed;
    }
    .card-body { padding: 12px 14px 0; }
    .card-pop .zone { color: var(--muted); font-size: 0.72rem; margin-bottom: 2px; }
    .card-pop h2 { margin: 0 0 10px; font-size: 1rem; font-weight: 650; line-height: 1.3; }
    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      margin: 0 0 12px;
    }
    .fact {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text);
    }
    .fact svg { width: 16px; height: 16px; flex: none; stroke: #55534e; fill: none; stroke-width: 1.7; }
    .fact span { color: var(--muted); }
    .open {
      display: block;
      text-align: center;
      background: #222;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .open:hover { background: #000; }
    .approx { color: var(--muted); font-size: 0.7rem; margin: -6px 0 10px; }
    .filters { padding: 0 16px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      border: none;
      background: var(--tag);
      color: var(--text);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: inherit;
    }
    .chip:hover { background: var(--hover); }
    .chip.active { background: var(--blue-bg); color: var(--blue); font-weight: 550; }
    @media (max-width: 800px) {
      html, body { height: 100%; height: 100dvh; overflow: hidden; }
      body {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr);
      }
      #map { grid-row: 1; grid-column: 1; min-height: 0; }
      aside {
        grid-row: 1;
        grid-column: 1;
        align-self: end;
        z-index: 500;
        height: min(46dvh, 420px);
        border-right: none;
        border-bottom: none;
        border-radius: 16px 16px 0 0;
        box-shadow: 0 -8px 28px rgba(15, 15, 15, .12);
        padding-bottom: env(safe-area-inset-bottom);
      }
      aside::before {
        content: "";
        width: 36px;
        height: 4px;
        border-radius: 99px;
        background: #d9d9d6;
        margin: 8px auto 0;
        flex: none;
      }
      header { padding: 6px 16px 4px; }
      header .emoji { display: none; }
      header h1 { font-size: 1.05rem; }
      header .sub { display: none; }
      .filters {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 0 12px 8px;
        -webkit-overflow-scrolling: touch;
      }
      .chip { flex: none; padding: 8px 12px; min-height: 36px; }
      #count { padding: 0 16px 4px; }
      #list { padding-bottom: 8px; }
      .leaflet-popup-content { width: min(280px, calc(100vw - 48px)) !important; }
      .leaflet-control-zoom { margin-top: 12px !important; }
    }

    #who-gate {
      position: fixed; inset: 0; z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(247, 246, 243, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 24px;
    }
    #who-gate[hidden] { display: none !important; }
    .who-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px 22px;
      width: min(360px, 100%);
      box-shadow: 0 16px 40px rgba(15,15,15,.08);
      text-align: center;
    }
    .who-card h2 { margin: 0 0 6px; font-size: 1.35rem; letter-spacing: -0.02em; }
    .who-card p { margin: 0 0 18px; color: var(--muted); font-size: 0.9rem; }
    .who-choices { display: grid; gap: 10px; }
    .who-btn {
      border: 1px solid var(--border);
      background: var(--page);
      border-radius: 10px;
      padding: 14px 16px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
    }
    .who-btn:hover { background: var(--blue-bg); border-color: #cce4fc; color: var(--blue); }
    .who-me {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 10px; font-size: 0.78rem; color: var(--muted);
    }
    .who-me button {
      border: none; background: transparent; color: var(--blue);
      font: inherit; font-size: inherit; cursor: pointer; padding: 0;
      text-decoration: underline;
    }
    .likes-line {
      grid-column: 1 / -1;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
      min-height: 1.1em;
    }
    .like-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      width: 100%;
      margin-bottom: 8px;
    }
    .like-btn.on { background: #ffe8ec; border-color: #ffc9d1; color: #e03131; }
    .like-btn .heart { font-size: 1rem; line-height: 1; }
    .row-like {
      border: none; background: transparent; cursor: pointer;
      font-size: 1rem; padding: 0 2px; line-height: 1;
      color: #c4c3bf;
    }
    .row-like.on { color: #e03131; }
    .row { grid-template-columns: 1fr auto auto; }

    .pin-heart-wrap { background: transparent !important; border: none !important; }
    .pin-heart {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e03131;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(15, 15, 15, .28);
      border: 2px solid #fff;
    }
    .pin-heart i {
      color: #fff;
      font-size: 13px;
      line-height: 1;
    }

    .card-photo.gone { filter: grayscale(1); opacity: 0.9; }
    .like-btn i, .row-like i { font-size: 0.95em; }
    .row-like { color: #c4c3bf; }
    .row-like.on { color: #e03131; }
    .like-btn .heart { display: inline-flex; align-items: center; }
  </style>
</head>
<body>

  <div id="who-gate" hidden>
    <div class="who-card">
      <h2>Ciao! Chi sei?</h2>
      <p>Così puoi mettere like alle case e vedere cosa piace agli altri.</p>
      <div class="who-choices">
        <button type="button" class="who-btn" data-person="Bonni">Bonni</button>
        <button type="button" class="who-btn" data-person="Ciccio">Ciccio</button>
        <button type="button" class="who-btn" data-person="Dade">Dade</button>
      </div>
    </div>
  </div>
  <aside>
    <header>
      <div class="emoji">🏠</div>
      <h1>Cerco Casa Avidamente</h1>
      <p class="sub">Solo i link del <a href="https://docs.google.com/spreadsheets/d/1HYXLX9SNe0J6xJBuxV6XUrnqAojN1Qf0iowcfWVIrMM/edit?gid=0#gid=0" target="_blank" rel="noopener">foglio</a><br/><span id="updated"></span></p>
    </header>
    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">Tutti</button>
      <button class="chip" data-filter="garage">Garage</button>
      <button class="chip" data-filter="3bed">3 camere</button>
      <button class="chip" data-filter="under280">≤280 €/testa</button>
    </div>
    <div id="count"></div>
    <div id="list"></div>
  </aside>
  <div id="map"></div>
  <script>
    const SHEET_ID = "1HYXLX9SNe0J6xJBuxV6XUrnqAojN1Qf0iowcfWVIrMM";

    const PEOPLE = ["Bonni", "Ciccio", "Dade"];
    const PERSON_KEY = "affitti-re-person";
    // Google Apps Script web app (Anyone). Updated after deploy.
    const LIKES_API_URL = "https://script.google.com/macros/s/AKfycbyewMC6joL46lI2bLbFITNn_xyRZAvNdd2BLjMhEVPxFJ4KLk8bFptOIs-_1Mjq9XA/exec";
    let currentPerson = localStorage.getItem(PERSON_KEY) || "";
    // likesById: { [listingId]: ["Bonni", "Dade"] }
    let likesById = {};

    function likersOf(id) {
      return (likesById[id] || []).slice().sort((a, b) => PEOPLE.indexOf(a) - PEOPLE.indexOf(b));
    }
    function likesLabel(id) {
      const names = likersOf(id);
      if (!names.length) return "";
      if (names.length === 1) return "Piace a " + names[0];
      if (names.length === 2) return "Piace a " + names[0] + " e " + names[1];
      return "Piace a " + names.slice(0, -1).join(", ") + " e " + names[names.length - 1];
    }
    function iLiked(id) {
      return !!currentPerson && likersOf(id).includes(currentPerson);
    }

    async function fetchLikes() {
      if (!LIKES_API_URL || LIKES_API_URL.indexOf("PLACEHOLDER") >= 0) {
        try {
          const raw = localStorage.getItem("affitti-re-likes-cache");
          likesById = raw ? JSON.parse(raw) : {};
        } catch (_) { likesById = {}; }
        return;
      }
      try {
        const res = await fetch(LIKES_API_URL + "?t=" + Date.now());
        const data = await res.json();
        likesById = data.likes || {};
        localStorage.setItem("affitti-re-likes-cache", JSON.stringify(likesById));
      } catch (err) {
        console.warn("likes fetch", err);
        try {
          const raw = localStorage.getItem("affitti-re-likes-cache");
          likesById = raw ? JSON.parse(raw) : {};
        } catch (_) { likesById = {}; }
      }
    }

    async function setLike(id, like) {
      if (!currentPerson) return;
      const set = new Set(likersOf(id));
      if (like) set.add(currentPerson); else set.delete(currentPerson);
      likesById[id] = Array.from(set);
      localStorage.setItem("affitti-re-likes-cache", JSON.stringify(likesById));
      render(allItems.filter(matches));
      if (!LIKES_API_URL || LIKES_API_URL.indexOf("PLACEHOLDER") >= 0) return;
      try {
        const q = "?id=" + encodeURIComponent(String(id))
          + "&person=" + encodeURIComponent(currentPerson)
          + "&like=" + (like ? "1" : "0")
          + "&t=" + Date.now();
        const res = await fetch(LIKES_API_URL + q);
        const data = await res.json();
        if (data && data.likes) {
          likesById = data.likes;
          localStorage.setItem("affitti-re-likes-cache", JSON.stringify(likesById));
        }
        render(allItems.filter(matches));
      } catch (err) {
        console.warn("likes save", err);
      }
    }

    function showGate(force) {
      const gate = document.getElementById("who-gate");
      if (!force && currentPerson && PEOPLE.includes(currentPerson)) {
        gate.hidden = true;
        updateWhoMe();
        return false;
      }
      gate.hidden = false;
      return true;
    }
    function updateWhoMe() {
      let el = document.getElementById("who-me");
      if (!el) {
        el = document.createElement("div");
        el.id = "who-me";
        el.className = "who-me";
        const header = document.querySelector("aside header");
        if (header) header.appendChild(el);
      }
      if (!currentPerson) { el.textContent = ""; return; }
      el.innerHTML = "Sei <strong>" + currentPerson + "</strong> · <button type=\"button\" id=\"who-change\">Cambia</button>";
      const btn = document.getElementById("who-change");
      if (btn) btn.onclick = () => showGate(true);
    }
    document.getElementById("who-gate").addEventListener("click", (e) => {
      const btn = e.target.closest(".who-btn");
      if (!btn) return;
      currentPerson = btn.dataset.person;
      localStorage.setItem(PERSON_KEY, currentPerson);
      document.getElementById("who-gate").hidden = true;
      updateWhoMe();
      render(allItems.filter(matches));
    });

    const ICONS = {
      price: '<svg viewBox="0 0 24 24"><path d="M12 2v20M17 6.5c0-1.5-2-2.5-5-2.5S7 5 7 7.5 9.5 10 12 10s5 1.2 5 3.5S14.5 16 12 16s-5-1-5-2.5"/></svg>',
      mq: '<svg viewBox="0 0 24 24"><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/><path d="M9 12h6"/></svg>',
      rooms: '<svg viewBox="0 0 24 24"><path d="M4 18V9l8-5 8 5v9"/><path d="M9 18v-5h6v5"/></svg>',
      baths: '<svg viewBox="0 0 24 24"><path d="M5 11h14v3a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5v-3z"/><path d="M7 11V7a2 2 0 0 1 2-2h1"/></svg>',
      floor: '<svg viewBox="0 0 24 24"><path d="M7 21V7l10-3v17"/><path d="M7 11h10M7 16h10"/></svg>',
      furn: '<svg viewBox="0 0 24 24"><path d="M4 13v5M20 13v5M3 13h18v-2a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v2z"/><path d="M6 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/></svg>',
      garage: '<svg viewBox="0 0 24 24"><path d="M4 20V10l8-5 8 5v10"/><path d="M8 20v-6h8v6"/></svg>'
    };

    function listingId(url) {
      if (!url) return "";
      const m = String(url).match(/(?:annunci|immobili|immobile)\/(\d+)/);
      return m ? m[1] : "";
    }
    function cleanUrl(url) {
      return String(url || "").split("#")[0].split("?")[0];
    }

    function loadSheet() {
      return new Promise((resolve, reject) => {
        let done = false;
        const finish = (fn, value) => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          fn(value);
        };
        const prev = window.google;
        window.google = {
          visualization: {
            Query: {
              setResponse(data) {
                window.google = prev;
                finish(resolve, data);
              }
            }
          }
        };
        const s = document.createElement("script");
        s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&gid=0&headers=0&t=" + Date.now();
        s.onerror = () => finish(reject, new Error("sheet"));
        document.head.appendChild(s);
        const timer = setTimeout(() => finish(reject, new Error("sheet-timeout")), 12000);
      });
    }

    function rowsFromSheet(data) {
      const rows = (data.table && data.table.rows) || [];
      const out = [];
      for (const row of rows) {
        const cells = row.c || [];
        const noteB = cells[1] && (cells[1].v || cells[1].f);
        const noteBStr = noteB != null ? String(noteB).trim() : "";
        // Solo i duplicati restano fuori mappa; le altre note in B sono di Davide.
        if (/^Duplicato\b/i.test(noteBStr)) continue;
        const cell = cells[0];
        const v = cell && (cell.v || cell.f);
        if (!v) continue;
        const s = String(v).trim();
        if (!/^https?:\/\//i.test(s)) continue;
        const noteC = cells[2] && (cells[2].v || cells[2].f);
        const noteCStr = noteC != null ? String(noteC).trim() : "";
        out.push({ url: s, noteB: noteBStr, noteC: noteCStr });
      }
      return out;
    }

        const map = L.map("map", { zoomControl: true }).setView([44.69, 10.63], 12);
    window.addEventListener("resize", () => map.invalidateSize());
    if (window.matchMedia("(max-width: 800px)").matches) {
      setTimeout(() => map.invalidateSize(), 200);
    }

    const base = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 16,
      attribution: "Tiles &copy; Esri"
    }).addTo(map);
    const labels = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 16
    }).addTo(map);
    let tileErrors = 0;
    function useFallbackTiles() {
      if (map._fallbackTiles) return;
      map._fallbackTiles = true;
      map.removeLayer(base);
      map.removeLayer(labels);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 19,
        subdomains: "abcd",
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      }).addTo(map);
    }
    base.on("tileerror", () => { if (++tileErrors > 3) useFallbackTiles(); });
    [0, 250, 800].forEach((ms) => setTimeout(() => map.invalidateSize(), ms));

    const markers = {};

    function fact(icon, label) {
      if (label == null || label === "") return "";
      return `<div class="fact">${icon}<span>${label}</span></div>`;
    }
    function popupHtml(item) {
      const d = item.detail || {};
      const title = d.title || "Annuncio";
      const facts = [
        fact(ICONS.price, d.price != null ? d.price + " €/mese" : null),
        fact(ICONS.price, d.sheetExpenses ? ("Spese/consumi: " + d.sheetExpenses) : (d.expenses != null ? d.expenses + " € spese/consumi" : "Spese/consumi: non indicate")),
        fact(ICONS.mq, d.mq ? d.mq + " m²" : null),
        fact(ICONS.rooms, d.bedrooms ? d.bedrooms + (d.bedrooms === 1 ? " camera" : " camere") : null),
        fact(ICONS.baths, d.baths ? d.baths + " bagno" : null),
        fact(ICONS.floor, d.floor ? d.floor + " piano" : null),
        fact(ICONS.furn, d.furnished === true ? "Arredato" : d.furnished === false ? "Non arredato" : null),
        fact(ICONS.garage, d.garage ? "Garage" : null)
      ].filter(Boolean).join("");
      const photo = d.image ? `<img class="card-photo${d.available === false ? " gone" : ""}" src="${d.image}" alt="">` : "";
      return `<div class="card-pop">
        ${photo}
        <div class="card-body">
        <div class="zone">${d.available === false ? "Non più in annuncio" : (d.zone || "Zona non indicata")}</div>
        <h2>${title}</h2>
        ${d.approx ? '<div class="approx">Posizione di zona</div>' : ""}
        <div class="facts">${facts || '<div class="fact"><span>Dettagli in arrivo</span></div>'}</div>
        <div class="likes-line">${likesLabel(item.id)}</div>
        <button type="button" class="like-btn${iLiked(item.id) ? " on" : ""}" data-like-id="${item.id}">
          <span class="heart"><i class="fa-${iLiked(item.id) ? "solid" : "regular"} fa-heart" aria-hidden="true"></i></span>
          ${iLiked(item.id) ? "Ti piace" : "Mi piace"}
        </button>
        <a class="open" href="${item.url}" target="_blank" rel="noopener">Apri annuncio</a>
        </div>
      </div>`;
    }

    let allItems = [];
    const activeFilters = new Set();

    function perPerson(item) {
      const price = item.detail && item.detail.price;
      return price == null ? Infinity : price / 3;
    }
    function matches(item) {
      const d = item.detail || {};
      if (activeFilters.has("garage") && !d.garage) return false;
      if (activeFilters.has("3bed") && (d.bedrooms || 0) < 3) return false;
      if (activeFilters.has("under280") && perPerson(item) > 280) return false;
      return true;
    }

    function pinStyle(d) {
      if (d.available === false) {
        return { radius: 8, color: "#fff", weight: 2, fillColor: "#9a9a97", fillOpacity: 1 };
      }
      if (d.approx === true || d.zoneSpecified === false || !d.zone) {
        return { radius: 9, color: "#2383e2", weight: 2, dashArray: "4 3", fillColor: "#9dc7f0", fillOpacity: 0.85 };
      }
      return { radius: 8, color: "#fff", weight: 2, fillColor: "#2383e2", fillOpacity: 1 };
    }
    function hasLikes(id) {
      return likersOf(id).length > 0;
    }
    function makeMarker(item, d) {
      const latlng = [d.lat, d.lng];
      if (d.available === false) {
        return L.circleMarker(latlng, pinStyle(d));
      }
      if (hasLikes(item.id)) {
        const icon = L.divIcon({
          className: "pin-heart-wrap",
          html: '<div class="pin-heart"><i class="fa-solid fa-heart" aria-hidden="true"></i></div>',
          iconSize: [30, 30],
          iconAnchor: [15, 15],
          popupAnchor: [0, -14]
        });
        return L.marker(latlng, { icon, zIndexOffset: 200 });
      }
      return L.circleMarker(latlng, pinStyle(d));
    }

    function render(items) {
      const list = document.getElementById("list");
      list.innerHTML = "";
      Object.values(markers).forEach(m => map.removeLayer(m));
      Object.keys(markers).forEach(k => delete markers[k]);
      document.getElementById("count").textContent =
        items.length + (items.length === 1 ? " casa" : " case");
      if (!items.length) {
        list.innerHTML = '<p class="empty">' + (!activeFilters.size ? "Nessun link nel foglio." : "Niente con questi filtri.") + '</p>';
        return;
      }
      const bounds = [];
      items.forEach((item) => {
        const d = item.detail || {};
        const hasPin = d.lat != null && d.lng != null;
        let marker = null;
        if (hasPin) {
          marker = makeMarker(item, d)
            .addTo(map)
            .bindPopup(popupHtml(item), { maxWidth: 300, minWidth: 260 });
          marker.on("popupopen", () => {
            const btn = document.querySelector('.like-btn[data-like-id="' + item.id + '"]');
            if (btn) btn.onclick = (ev) => {
              ev.preventDefault();
              ev.stopPropagation();
              setLike(item.id, !iLiked(item.id));
            };
          });
          markers[item.id] = marker;
          bounds.push([d.lat, d.lng]);
        }
        const row = document.createElement("div");
        row.className = "row";
        const bits = [
          d.available === false ? "non più in annuncio" : d.zone,
          d.mq ? d.mq + " m²" : null,
          d.bedrooms ? d.bedrooms + (d.bedrooms === 1 ? " camera" : " camere") : null,
          d.garage ? "garage" : null,
          !hasPin ? "posizione da leggere" : null
        ].filter(Boolean);
        const liked = iLiked(item.id);
        const likeText = likesLabel(item.id);
        row.innerHTML = `
          <div class="title">${d.title || "Annuncio"}</div>
          <button type="button" class="row-like${liked ? " on" : ""}" data-like-id="${item.id}" aria-label="Mi piace"><i class="fa-${liked ? "solid" : "regular"} fa-heart" aria-hidden="true"></i></button>
          <div class="price">${d.price != null ? d.price + " €" : ""}</div>
          <div class="meta">${[...(bits), d.sheetExpenses ? ("spese/consumi: " + d.sheetExpenses) : (d.expenses != null ? d.expenses + " € spese/consumi" : (d.price != null ? "spese/consumi non indicate" : null)), likeText || null].filter(Boolean).join(" · ") || item.url}</div>`;
        row.querySelector(".row-like").addEventListener("click", (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          setLike(item.id, !iLiked(item.id));
        });
        row.addEventListener("click", () => {
          document.querySelectorAll(".row").forEach(c => c.classList.remove("active"));
          row.classList.add("active");
          if (marker) {
            map.setView([d.lat, d.lng], 15);
            marker.openPopup();
          } else {
            window.open(item.url, "_blank", "noopener");
          }
        });
        list.appendChild(row);
      });
      const mobile = window.matchMedia("(max-width: 800px)").matches;
      if (bounds.length) map.fitBounds(bounds, { padding: mobile ? [24, 24, 280, 24] : [40, 40], maxZoom: 14 });
      setTimeout(() => map.invalidateSize(), 50);
    }


    document.getElementById("filters").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      const filter = btn.dataset.filter;
      const chips = document.querySelectorAll(".chip");
      if (filter === "all") {
        activeFilters.clear();
      } else if (activeFilters.has(filter)) {
        activeFilters.delete(filter);
      } else {
        activeFilters.add(filter);
      }
      chips.forEach(c => c.classList.toggle("active", activeFilters.has(c.dataset.filter)));
      document.querySelector('[data-filter="all"]').classList.toggle("active", activeFilters.size === 0);
      render(allItems.filter(matches));
    });

    showGate(false);
    (async () => {
      try {
        const [sheet, detailsRes] = await Promise.all([
          loadSheet(),
          fetch("details.json?t=" + Date.now()).then(r => r.ok ? r.json() : {}),
          fetchLikes()
        ]);
        const sheetRows = rowsFromSheet(sheet);
        const seen = new Set();
        const items = [];
        for (const row of sheetRows) {
          const url = row.url;
          const id = listingId(url) || cleanUrl(url);
          if (!id || seen.has(id)) continue;
          seen.add(id);
          const detail = Object.assign({}, detailsRes[id] || {});
          if (row.noteC) detail.sheetExpenses = row.noteC;
          if (row.noteB) detail.sheetNote = row.noteB;
          const beds = Number(detail.bedrooms);
          const people = Number(detail.maxPeople);
          if (Number.isFinite(beds) && beds < 2) continue;
          if (Number.isFinite(people) && people <= 2) continue;
          items.push({ id, url: cleanUrl(url), detail });
        }
        document.getElementById("updated").textContent = "Aggiornato dal foglio · " + items.length + " case";
        allItems = items;
        render(items.filter(matches));
      } catch (err) {
        document.getElementById("list").innerHTML = '<p class="empty">Non riesco a leggere il foglio.</p>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
