<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cerco Casa Avidamente</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #fff;
      --page: #f7f6f3;
      --text: #37352f;
      --muted: #787774;
      --border: #e9e9e7;
      --hover: #efefed;
      --blue: #2383e2;
      --blue-bg: #e7f3ff;
      --tag: #f1f1ef;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--page);
      color: var(--text);
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      letter-spacing: -0.01em;
    }
    aside {
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    header { padding: 28px 24px 16px; }
    header .emoji { font-size: 1.6rem; line-height: 1; margin-bottom: 8px; }
    header h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    header .sub { margin: 6px 0 0; color: var(--muted); font-size: 0.8rem; line-height: 1.4; }
    header a { color: var(--blue); text-decoration: none; }
    #count { padding: 0 24px 8px; font-size: 0.75rem; color: var(--muted); }
    #list { overflow: auto; flex: 1; padding: 0 8px 16px; }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .row:hover { background: var(--hover); }
    .row.active { background: var(--blue-bg); border-color: #cce4fc; }
    .row .title { font-size: 0.92rem; font-weight: 550; line-height: 1.3; }
    .row .meta { grid-column: 1 / -1; color: var(--muted); font-size: 0.78rem; line-height: 1.35; }
    .row .price { font-size: 0.92rem; font-weight: 600; white-space: nowrap; }
    .empty { color: var(--muted); padding: 16px 12px; font-size: 0.85rem; }
    #map { width: 100%; height: 100%; background: #f0f0f0; }
    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(15, 15, 15, .12);
      font-family: inherit;
      padding: 0;
    }
    .leaflet-popup-content { margin: 0; width: 280px !important; }
    .leaflet-popup-tip { box-shadow: none; }
    .card-pop { padding: 0 0 12px; }
    .card-photo {
      width: 100%;
      height: 156px;
      object-fit: cover;
      display: block;
      background: #efefed;
    }
    .card-body { padding: 12px 14px 0; }
    .card-pop .zone { color: var(--muted); font-size: 0.72rem; margin-bottom: 2px; }
    .card-pop h2 { margin: 0 0 10px; font-size: 1rem; font-weight: 650; line-height: 1.3; }
    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      margin: 0 0 12px;
    }
    .fact {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text);
    }
    .fact svg { width: 16px; height: 16px; flex: none; stroke: #55534e; fill: none; stroke-width: 1.7; }
    .fact span { color: var(--muted); }
    .open {
      display: block;
      text-align: center;
      background: #222;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .open:hover { background: #000; }
    .approx { color: var(--muted); font-size: 0.7rem; margin: -6px 0 10px; }
    .filters { padding: 0 16px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      border: none;
      background: var(--tag);
      color: var(--text);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: inherit;
    }
    .chip:hover { background: var(--hover); }
    .chip.active { background: var(--blue-bg); color: var(--blue); font-weight: 550; }
    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; grid-template-rows: 42% 58%; }
      aside { border-right: none; border-bottom: 1px solid var(--border); }
      header { padding: 16px 16px 8px; }
    }
  </style>
</head>
<body>
  <aside>
    <header>
      <div class="emoji">🏠</div>
      <h1>Cerco Casa Avidamente</h1>
      <p class="sub">Solo i link del <a href="https://docs.google.com/spreadsheets/d/1HYXLX9SNe0J6xJBuxV6XUrnqAojN1Qf0iowcfWVIrMM/edit?gid=0#gid=0" target="_blank" rel="noopener">foglio</a><br/><span id="updated"></span></p>
    </header>
    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">Tutti</button>
      <button class="chip" data-filter="garage">Garage</button>
      <button class="chip" data-filter="3bed">3 camere</button>
      <button class="chip" data-filter="under280">≤280 €/testa</button>
    </div>
    <div id="count"></div>
    <div id="list"></div>
  </aside>
  <div id="map"></div>
  <script>
    const SHEET_ID = "1HYXLX9SNe0J6xJBuxV6XUrnqAojN1Qf0iowcfWVIrMM";
    const ICONS = {
      price: '<svg viewBox="0 0 24 24"><path d="M12 2v20M17 6.5c0-1.5-2-2.5-5-2.5S7 5 7 7.5 9.5 10 12 10s5 1.2 5 3.5S14.5 16 12 16s-5-1-5-2.5"/></svg>',
      mq: '<svg viewBox="0 0 24 24"><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/><path d="M9 12h6"/></svg>',
      rooms: '<svg viewBox="0 0 24 24"><path d="M4 18V9l8-5 8 5v9"/><path d="M9 18v-5h6v5"/></svg>',
      baths: '<svg viewBox="0 0 24 24"><path d="M5 11h14v3a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5v-3z"/><path d="M7 11V7a2 2 0 0 1 2-2h1"/></svg>',
      floor: '<svg viewBox="0 0 24 24"><path d="M7 21V7l10-3v17"/><path d="M7 11h10M7 16h10"/></svg>',
      furn: '<svg viewBox="0 0 24 24"><path d="M4 13v5M20 13v5M3 13h18v-2a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v2z"/><path d="M6 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/></svg>',
      garage: '<svg viewBox="0 0 24 24"><path d="M4 20V10l8-5 8 5v10"/><path d="M8 20v-6h8v6"/></svg>'
    };

    function listingId(url) {
      if (!url) return "";
      const m = String(url).match(/(?:annunci|immobili|immobile)\/(\d+)/);
      return m ? m[1] : "";
    }
    function cleanUrl(url) {
      return String(url || "").split("#")[0].split("?")[0];
    }

    function loadSheet() {
      return new Promise((resolve, reject) => {
        const prev = window.google;
        window.google = {
          visualization: {
            Query: {
              setResponse(data) {
                window.google = prev;
                resolve(data);
              }
            }
          }
        };
        const s = document.createElement("script");
        s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&gid=0&t=" + Date.now();
        s.onerror = () => reject(new Error("sheet"));
        document.head.appendChild(s);
      });
    }

    function urlsFromSheet(data) {
      const rows = (data.table && data.table.rows) || [];
      const urls = [];
      for (const row of rows) {
        const cells = row.c || [];
        const note = cells[1] && (cells[1].v || cells[1].f);
        if (note && String(note).trim()) continue;
        const cell = cells[0];
        const v = cell && (cell.v || cell.f);
        if (!v) continue;
        const s = String(v).trim();
        if (/^https?:\/\//i.test(s)) urls.push(s);
      }
      return urls;
    }

    const map = L.map("map", { zoomControl: true }).setView([44.69, 10.63], 12);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 16,
      attribution: "Tiles &copy; Esri"
    }).addTo(map);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 16
    }).addTo(map);

    const markers = {};

    function fact(icon, label) {
      if (label == null || label === "") return "";
      return `<div class="fact">${icon}<span>${label}</span></div>`;
    }
    function popupHtml(item) {
      const d = item.detail || {};
      const title = d.title || "Annuncio";
      const facts = [
        fact(ICONS.price, d.price != null ? d.price + " €/mese" : null),
        fact(ICONS.mq, d.mq ? d.mq + " m²" : null),
        fact(ICONS.rooms, d.bedrooms ? d.bedrooms + (d.bedrooms === 1 ? " camera" : " camere") : null),
        fact(ICONS.baths, d.baths ? d.baths + " bagno" : null),
        fact(ICONS.floor, d.floor ? d.floor + " piano" : null),
        fact(ICONS.furn, d.furnished === true ? "Arredato" : d.furnished === false ? "Non arredato" : null),
        fact(ICONS.garage, d.garage ? "Garage" : null)
      ].filter(Boolean).join("");
      const photo = d.image ? `<img class="card-photo" src="${d.image}" alt="">` : "";
      return `<div class="card-pop">
        ${photo}
        <div class="card-body">
        <div class="zone">${d.zone || "Zona non indicata"}</div>
        <h2>${title}</h2>
        ${d.approx ? '<div class="approx">Posizione di zona</div>' : ""}
        <div class="facts">${facts || '<div class="fact"><span>Dettagli in arrivo</span></div>'}</div>
        <a class="open" href="${item.url}" target="_blank" rel="noopener">Apri annuncio</a>
        </div>
      </div>`;
    }

    let allItems = [];
    let activeFilter = "all";

    function perPerson(item) {
      const price = item.detail && item.detail.price;
      return price == null ? Infinity : price / 3;
    }
    function matches(item) {
      const d = item.detail || {};
      if (activeFilter === "garage") return !!d.garage;
      if (activeFilter === "3bed") return (d.bedrooms || 0) >= 3;
      if (activeFilter === "under280") return perPerson(item) <= 280;
      return true;
    }

    function render(items) {
      const list = document.getElementById("list");
      list.innerHTML = "";
      Object.values(markers).forEach(m => map.removeLayer(m));
      Object.keys(markers).forEach(k => delete markers[k]);
      document.getElementById("count").textContent =
        items.length + (items.length === 1 ? " casa" : " case");
      if (!items.length) {
        list.innerHTML = '<p class="empty">' + (activeFilter === "all" ? "Nessun link nel foglio." : "Niente con questo filtro.") + '</p>';
        return;
      }
      const bounds = [];
      items.forEach((item) => {
        const d = item.detail || {};
        const hasPin = d.lat != null && d.lng != null;
        let marker = null;
        const zoneMissing = d.approx === true || d.zoneSpecified === false || !d.zone;
        if (hasPin) {
          marker = L.circleMarker([d.lat, d.lng], zoneMissing ? {
            radius: 9,
            color: "#2383e2",
            weight: 2,
            dashArray: "4 3",
            fillColor: "#9dc7f0",
            fillOpacity: 0.85
          } : {
            radius: 8,
            color: "#fff",
            weight: 2,
            fillColor: "#2383e2",
            fillOpacity: 1
          }).addTo(map).bindPopup(popupHtml(item), { maxWidth: 300, minWidth: 260 });
          markers[item.id] = marker;
          bounds.push([d.lat, d.lng]);
        }
        const row = document.createElement("div");
        row.className = "row";
        const bits = [d.zone, d.mq ? d.mq + " m²" : null, d.bedrooms ? d.bedrooms + (d.bedrooms === 1 ? " camera" : " camere") : null, d.garage ? "garage" : null, !hasPin ? "posizione da leggere" : null].filter(Boolean);
        row.innerHTML = `
          <div class="title">${d.title || "Annuncio"}</div>
          <div class="price">${d.price != null ? d.price + " €" : ""}</div>
          <div class="meta">${bits.join(" · ") || item.url}</div>`;
        row.addEventListener("click", () => {
          document.querySelectorAll(".row").forEach(c => c.classList.remove("active"));
          row.classList.add("active");
          if (marker) {
            map.setView([d.lat, d.lng], 15);
            marker.openPopup();
          } else {
            window.open(item.url, "_blank", "noopener");
          }
        });
        list.appendChild(row);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
    }


    document.getElementById("filters").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.filter;
      render(allItems.filter(matches));
    });

    (async () => {
      try {
        const [sheet, detailsRes] = await Promise.all([
          loadSheet(),
          fetch("details.json?t=" + Date.now()).then(r => r.ok ? r.json() : {})
        ]);
        const urls = urlsFromSheet(sheet);
        const seen = new Set();
        const items = [];
        for (const url of urls) {
          const id = listingId(url) || cleanUrl(url);
          if (!id || seen.has(id)) continue;
          seen.add(id);
          const detail = detailsRes[id] || {};
          const beds = Number(detail.bedrooms);
          const people = Number(detail.maxPeople);
          if (Number.isFinite(beds) && beds < 2) continue;
          if (Number.isFinite(people) && people <= 2) continue;
          items.push({ id, url: cleanUrl(url), detail });
        }
        document.getElementById("updated").textContent = "Aggiornato dal foglio · " + items.length + " case";
        allItems = items;
        render(items.filter(matches));
      } catch (err) {
        document.getElementById("list").innerHTML = '<p class="empty">Non riesco a leggere il foglio.</p>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
